# xnotes BR: compila o APK automaticamente a cada envio e publica em "Releases".
name: Gerar APK do xnotes BR

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK e CMake usados pelo projeto
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "platform-tools"

      - name: Guardar cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restaurar a chave de assinatura (segredo do GitHub)
        env:
          S_KEY: ${{ secrets.XNOTESBR_KEYSTORE }}
          S_PW: ${{ secrets.XNOTESBR_PASSWORD }}
          V_KEY: ${{ vars.XNOTESBR_KEYSTORE }}
          V_PW: ${{ vars.XNOTESBR_PASSWORD }}
        run: |
          echo "Diagnóstico (só mostra se existe, nunca o valor):"
          for n in S_KEY S_PW V_KEY V_PW; do v="${!n}"; if [ -n "$v" ]; then echo "  $n: cadastrado (${#v} caracteres)"; else echo "  $n: vazio"; fi; done
          KEY="${S_KEY:-$V_KEY}"; PW="${S_PW:-$V_PW}"
          if [ -z "$S_KEY" ] && [ -n "$V_KEY" ]; then echo "::warning::A chave foi cadastrada em Variables (visível a todos). O certo é a aba Secrets."; fi
          if [ -z "$KEY" ] || [ -z "$PW" ]; then
            echo "::error::Segredos não encontrados. Cadastre XNOTESBR_KEYSTORE e XNOTESBR_PASSWORD em Settings > Secrets and variables > Actions > aba Secrets > New repository secret."
            exit 1
          fi
          mkdir -p signing
          echo "$KEY" | tr -d ' \r\n' | base64 -d > signing/xnotesbr.p12
          echo "::add-mask::$PW"
          echo "XNOTESBR_PASSWORD=$PW" >> "$GITHUB_ENV"
          ls -la signing

      - name: Compilar o APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f signing/xnotesbr.p12

      - name: Renomear o APK
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/*.apk "saida/xnotes-BR-${{ github.run_number }}.apk"
          ls -la saida

      - name: Guardar o APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: xnotes-BR-${{ github.run_number }}
          path: saida/*.apk

      - name: Publicar em Releases (para baixar no tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: br-${{ github.run_number }}
          name: xnotes BR (versão ${{ github.run_number }})
          body: |
            APK gerado automaticamente. No tablet, toque no arquivo .apk abaixo para baixar e instalar.
            Instala ao lado do xnotes original (nome interno com.xnotes.br).
          files: saida/*.apk
